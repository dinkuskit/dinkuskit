name: Docs publish

# Publishes merged doc updates (docs/updates/) to dinkuskit.com and checks the
# published docs twice a month (GrillTrack decision website-docs-sync-077).
# The same twice-monthly run also checks each plugin reference article against
# that plugin's latest stable release (website-docs-from-plugin-releases-086).
# Runs one at a time and never cancels, and always checks out the newest main,
# so an older run cannot publish older text. Stopped articles become issues.
on:
  push:
    branches: [main]
    paths: ['docs/updates/**']
  schedule:
    - cron: '0 14 1,15 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: docs-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish doc updates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The publisher's EmDash API token (website-agent-api-tokens-20261027) once
    # set; the Access service token pair until then.
    env:
      EMDASH_TOKEN: ${{ secrets.DOCS_PUBLISH_EMDASH_TOKEN }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.DOCS_PUBLISH_EMDASH_TOKEN == '' && secrets.DOCS_PUBLISH_ACCESS_CLIENT_ID || '' }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.DOCS_PUBLISH_EMDASH_TOKEN == '' && secrets.DOCS_PUBLISH_ACCESS_CLIENT_SECRET || '' }}
      PUBLISHER_READY: ${{ secrets.DOCS_PUBLISH_EMDASH_TOKEN != '' || (secrets.DOCS_PUBLISH_ACCESS_CLIENT_ID != '' && secrets.DOCS_PUBLISH_ACCESS_CLIENT_SECRET != '') }}
    steps:
      - name: Wait for the publisher's token
        if: env.PUBLISHER_READY != 'true'
        run: echo "::notice::Neither DOCS_PUBLISH_EMDASH_TOKEN nor both DOCS_PUBLISH_ACCESS_CLIENT_ID and DOCS_PUBLISH_ACCESS_CLIENT_SECRET are set, so nothing was published."
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        if: env.PUBLISHER_READY == 'true'
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: env.PUBLISHER_READY == 'true'
        with:
          node-version-file: .nvmrc
      - name: Publish and check
        if: env.PUBLISHER_READY == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types scripts/docs-sync.mjs publish --report

  versions:
    name: Check plugin articles against their releases
    # Twice a month and by hand. A release presses Docs from a plugin release;
    # this catches one that did not. One issue per article that is behind.
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Compare version scopes with the latest stable releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types scripts/docs-sync.mjs versions --report
